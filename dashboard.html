<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Ruptura — Lojas Giovanna</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 20px;
    min-height: 100vh;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .container { max-width: 1400px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    margin-bottom: 28px; padding-bottom: 16px; border-bottom: 2px solid #0f3460;
  }
  .header h1 {
    font-size: 1.6rem; font-weight: 600; color: #fff;
    letter-spacing: -0.02em;
  }
  .header-badges { display: flex; gap: 10px; align-items: center; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .badge-irc { background: #e94560; color: #fff; }
  .badge-cities { background: #0f3460; color: #16c79a; }

  /* KPIs */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 28px;
  }
  .kpi-card {
    background: #16213e; border-radius: 12px; padding: 20px; position: relative;
    overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
    animation: cardIn 0.5s ease backwards;
  }
  .kpi-card:nth-child(1) { animation-delay: 0.05s; }
  .kpi-card:nth-child(2) { animation-delay: 0.10s; }
  .kpi-card:nth-child(3) { animation-delay: 0.15s; }
  .kpi-card:nth-child(4) { animation-delay: 0.20s; }
  .kpi-card:nth-child(5) { animation-delay: 0.25s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.15); }
  .kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8899b0; margin-bottom: 6px; }
  .kpi-value { font-size: 1.8rem; font-weight: 700; color: #fff; }
  .kpi-value.green { color: #16c79a; }
  .kpi-value.accent { color: #e94560; }
  .kpi-value.blue { color: #4a9eff; }

  /* Charts row */
  .charts-row {
    display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; margin-bottom: 28px;
  }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .card {
    background: #16213e; border-radius: 12px; padding: 24px;
    animation: cardIn 0.5s ease backwards;
  }
  .card-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8899b0; margin-bottom: 16px; }

  /* Donut */
  .donut-container { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: left; padding: 10px 8px; color: #8899b0; font-weight: 500; border-bottom: 1px solid #1a1a2e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
  td { padding: 10px 8px; border-bottom: 1px solid #1a1a2e; }
  tr:hover td { background: rgba(233,69,96,0.05); }
  .bar-progress { height: 6px; background: #1a1a2e; border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar-fill { height: 100%; border-radius: 4px; background: #e94560; animation: growBar 0.8s ease forwards; transform-origin: left; }
  @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .risk-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
  .risk-critico { background: rgba(233,69,96,0.2); color: #e94560; }
  .risk-alerta { background: rgba(255,107,53,0.2); color: #ff6b35; }
  .risk-normal { background: rgba(74,158,255,0.15); color: #4a9eff; }
  .risk-confortavel { background: rgba(22,199,154,0.15); color: #16c79a; }
  .risk-excesso { background: rgba(108,92,231,0.15); color: #6c5ce7; }

  /* Bar chart */
  .bar-chart { padding-top: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .bar-label { width: 120px; text-align: right; font-size: 0.72rem; color: #8899b0; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 18px; background: #1a1a2e; border-radius: 4px; position: relative; overflow: hidden; }
  .bar-fill-h { height: 100%; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 0.65rem; color: #fff; font-weight: 600; animation: growBarH 0.7s ease forwards; transform-origin: left; }
  @keyframes growBarH { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar-ref { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.15); z-index: 1; }
  .bar-ref-label { position: absolute; top: -14px; transform: translateX(-50%); font-size: 0.6rem; color: rgba(255,255,255,0.25); }

  /* Insights */
  .insights-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; margin-top: 28px;
  }
  .insight-card {
    background: #16213e; border-radius: 10px; padding: 16px;
    border-left: 3px solid #e94560; animation: cardIn 0.5s ease backwards;
  }
  .insight-card:nth-child(1) { animation-delay: 0.3s; }
  .insight-card:nth-child(2) { animation-delay: 0.35s; }
  .insight-card:nth-child(3) { animation-delay: 0.4s; }
  .insight-card:nth-child(4) { animation-delay: 0.45s; }
  .insight-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8899b0; margin-bottom: 4px; }
  .insight-value { font-size: 1.1rem; font-weight: 600; color: #fff; }

  .footer {
    margin-top: 40px; padding: 16px 0; border-top: 1px solid #0f3460;
    font-size: 0.7rem; color: #556; text-align: center;
  }

  .error-msg {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 40px;
  }
  .error-msg div { background: #16213e; padding: 32px; border-radius: 12px; max-width: 480px; }
  .error-msg h2 { color: #e94560; margin-bottom: 12px; }
  .error-msg p { color: #8899b0; font-size: 0.9rem; line-height: 1.5; }
  .error-msg code { display: inline-block; background: #1a1a2e; padding: 2px 8px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #16c79a; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
(function() {
  var app = document.getElementById('app');

  var COLORS = {
    critico: '#e94560',
    alerta: '#ff6b35',
    normal: '#4a9eff',
    confortavel: '#16c79a',
    excesso: '#6c5ce7'
  };

  var RISK_ORDER = ['critico','alerta','normal','confortavel','excesso'];
  var RISK_LABELS = {
    critico: 'Critico', alerta: 'Alerta', normal: 'Normal',
    confortavel: 'Confortavel', excesso: 'Excesso'
  };

  fetch('data/rupture_report.csv')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(csvText) {
      var lines = csvText.trim().split('\n');
      if (lines.length < 2) throw new Error('CSV vazio');
      var headers = lines[0].split(',').map(function(h) { return h.trim(); });
      var data = lines.slice(1).map(function(line) {
        var vals = line.split(',');
        var obj = {};
        headers.forEach(function(h, i) {
          var v = vals[i];
          if (v === undefined || v === '') { obj[h] = null; return; }
          var num = parseFloat(v);
          obj[h] = isNaN(num) ? v.trim() : num;
        });
        return obj;
      });
      renderDashboard(data);
    })
    .catch(function(err) {
      app.innerHTML =
        '<div class="error-msg"><div>' +
        '<h2>CSV nao encontrado</h2>' +
        '<p>Execute o pipeline primeiro:</p>' +
        '<p><code>python main.py --local</code></p>' +
        '<p style="margin-top:12px;font-size:0.75rem;color:#445">' + esc(err.message) + '</p>' +
        '</div></div>';
    });

  function renderDashboard(data) {
    var totalCidades = data.length;

    var ircSum = 0, coberturaSum = 0, qtdCriticoSum = 0;
    for (var i = 0; i < data.length; i++) {
      ircSum += data[i].irc_medio || 0;
      coberturaSum += data[i].cobertura_media_dias || 0;
      qtdCriticoSum += data[i].qtd_critico || 0;
    }
    var ircMedio = totalCidades ? (ircSum / totalCidades) : 0;
    var coberturaMedia = totalCidades ? (coberturaSum / totalCidades) : 0;

    var riskDist = { critico: 0, alerta: 0, normal: 0, confortavel: 0, excesso: 0 };
    for (var i = 0; i < data.length; i++) {
      var r = (data[i].risco_predominante || '').toLowerCase().trim();
      if (riskDist[r] !== undefined) riskDist[r]++;
      else riskDist.excesso++;
    }

    var sorted = data.slice().sort(function(a, b) { return (b.irc_medio || 0) - (a.irc_medio || 0); });
    var top10 = sorted.slice(0, 10);
    var lider = sorted[0];

    var cidadesCriticas = 0;
    for (var i = 0; i < data.length; i++) {
      if ((data[i].pct_critico || 0) > 25) cidadesCriticas++;
    }

    var html = '';

    // Header
    html += '<div class="header">';
    html += '<h1>Monitor de Ruptura <span style="font-weight:300;color:#8899b0;">&mdash; Lojas Giovanna</span></h1>';
    html += '<div class="header-badges">';
    html += '<span class="badge badge-irc">IRC v2</span>';
    html += '<span class="badge badge-cities">' + totalCidades + ' cidades</span>';
    html += '</div></div>';

    // KPI Grid
    html += '<div class="kpi-grid">';
    html += kpiCard('Total de Cidades', totalCidades, 'green');
    html += kpiCard('IRC Medio Geral', (ircMedio * 100).toFixed(1) + '%', 'accent');
    html += kpiCard('Cobertura Media', coberturaMedia.toFixed(1) + ' dias', 'blue');
    html += kpiCard('Produtos Criticos', qtdCriticoSum.toLocaleString('pt-BR'), 'accent');
    html += kpiCard('Registros Processados', '20.000', '');
    html += '</div>';

    // Charts row
    html += '<div class="charts-row">';

    // Donut
    html += '<div class="card">';
    html += '<div class="card-title">Distribuicao de Riscos</div>';
    html += '<div class="donut-container">';
    html += donutSVG(riskDist);
    html += '<div class="donut-legend">';
    for (var r = 0; r < RISK_ORDER.length; r++) {
      var k = RISK_ORDER[r];
      var cnt = riskDist[k] || 0;
      if (cnt > 0) {
        html += '<span class="legend-item"><span class="legend-dot" style="background:' + COLORS[k] + '"></span>' +
          RISK_LABELS[k] + ' (' + cnt + ')</span>';
      }
    }
    html += '</div></div></div>';

    // Bar chart
    html += '<div class="card">';
    html += '<div class="card-title">IRC Medio por Cidade <span style="font-weight:300;color:#556;font-size:0.7rem;">(ordenado)</span></div>';
    html += '<div class="bar-chart" id="barChart">';
    for (var i = 0; i < sorted.length; i++) {
      var d = sorted[i];
      var pct = (d.irc_medio || 0) * 100;
      html += '<div class="bar-row">';
      html += '<span class="bar-label" title="' + esc(d.regiao) + '">' + esc(trunc(d.regiao, 18)) + '</span>';
      html += '<div class="bar-track">';
      html += '<div class="bar-fill-h" style="width:' + Math.max(pct, 1) + '%;background:' + barColor(d.irc_medio) + '">';
      html += '<span>' + pct.toFixed(1) + '%</span>';
      html += '</div>';
      if (i === 0) {
        html += '<div class="bar-ref" style="left:25%"><span class="bar-ref-label">25%</span></div>';
        html += '<div class="bar-ref" style="left:50%"><span class="bar-ref-label">50%</span></div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';

    html += '</div>'; // end charts-row

    // Table Top 10
    html += '<div class="card">';
    html += '<div class="card-title">Top 10 Cidades por IRC</div>';
    html += '<div class="table-wrap"><table>';
    html += '<thead><tr><th>#</th><th>Cidade</th><th>IRC Medio</th><th>Cobertura (dias)</th><th>% Critico</th><th>Risco</th></tr></thead><tbody>';
    for (var i = 0; i < top10.length; i++) {
      var d = top10[i];
      var ircPct = (d.irc_medio || 0) * 100;
      var critPct = (d.pct_critico || 0);
      html += '<tr>';
      html += '<td style="color:#8899b0">' + (i + 1) + '</td>';
      html += '<td><strong>' + esc(d.regiao) + '</strong></td>';
      html += '<td>' + ircPct.toFixed(1) + '%<div class="bar-progress" style="margin-top:4px"><div class="bar-fill" style="transform:scaleX(' + Math.min(ircPct / 100, 1) + ');background:' + barColor(d.irc_medio) + '"></div></div></td>';
      html += '<td>' + (d.cobertura_media_dias || 0).toFixed(1) + '</td>';
      html += '<td>' + critPct.toFixed(1) + '%</td>';
      html += '<td>' + riskTag(d.risco_predominante) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';

    // Insights
    html += '<div class="insights-grid">';
    html += insightCard('Cidade Lider', esc(lider.regiao) + ' (' + ((lider.irc_medio || 0) * 100).toFixed(1) + '%)');
    html += insightCard('Produtos em Estado Critico', qtdCriticoSum.toLocaleString('pt-BR'));
    html += insightCard('Media Geral de IRC', (ircMedio * 100).toFixed(1) + '%');
    html += insightCard('Cidades com >25% Criticos', cidadesCriticas + ' de ' + totalCidades);
    html += '</div>';

    // Footer
    html += '<div class="footer">';
    html += 'IRC = max(0, 1 - cobertura_dias / 14) &bull; cobertura = estoque / giro diario &bull; Fonte: ShadowTraffic';
    html += '</div>';

    app.innerHTML = html;
  }

  function kpiCard(label, value, cls) {
    var c = cls ? ' ' + cls : '';
    return '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value' + c + '">' + value + '</div></div>';
  }

  function insightCard(label, value) {
    return '<div class="insight-card"><div class="insight-label">' + label + '</div><div class="insight-value">' + value + '</div></div>';
  }

  function donutSVG(dist) {
    var total = 0;
    for (var r = 0; r < RISK_ORDER.length; r++) total += dist[RISK_ORDER[r]] || 0;
    if (total === 0) return '<svg width="180" height="180" viewBox="0 0 180 180"><text x="90" y="90" text-anchor="middle" fill="#556" font-size="14">Sem dados</text></svg>';

    var cx = 90, cy = 90, r = 68, pi = Math.PI;
    var paths = [], cumulative = 0;
    for (var i = 0; i < RISK_ORDER.length; i++) {
      var k = RISK_ORDER[i];
      var cnt = dist[k] || 0;
      if (cnt === 0) continue;
      var frac = cnt / total;
      var a1 = cumulative * 2 * pi;
      var a2 = (cumulative + frac) * 2 * pi;
      cumulative += frac;
      var x1 = cx + r * Math.sin(a1);
      var y1 = cy - r * Math.cos(a1);
      var x2 = cx + r * Math.sin(a2);
      var y2 = cy - r * Math.cos(a2);
      var large = frac > 0.5 ? 1 : 0;
      var d = 'M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + large + ',1 ' + x2 + ',' + y2 + ' Z';
      paths.push('<path d="' + d + '" fill="' + COLORS[k] + '" />');
    }
    var holeR = 42;
    paths.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + holeR + '" fill="#16213e" />');
    var pctCenter = total ? ((dist.critico || 0) / total * 100).toFixed(0) : '0';
    paths.push('<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">' + pctCenter + '%</text>');
    paths.push('<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" fill="#8899b0" font-size="10">critico</text>');
    return '<svg width="200" height="200" viewBox="0 0 180 180" style="max-width:200px">' + paths.join('') + '</svg>';
  }

  function barColor(val) {
    if (val === null || val === undefined) return '#4a9eff';
    if (val > 0.5) return '#e94560';
    if (val > 0.25) return '#ff6b35';
    return '#16c79a';
  }

  function riskTag(risk) {
    if (!risk) return '<span class="risk-tag risk-normal">N/A</span>';
    var r = risk.toLowerCase().trim();
    var cls = 'risk-normal';
    if (r === 'critico') cls = 'risk-critico';
    else if (r === 'alerta') cls = 'risk-alerta';
    else if (r === 'confortavel') cls = 'risk-confortavel';
    else if (r === 'excesso') cls = 'risk-excesso';
    return '<span class="risk-tag ' + cls + '">' + esc(risk) + '</span>';
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function trunc(s, n) {
    if (!s) return '';
    return s.length > n ? s.substring(0, n) + '...' : s;
  }
})();
</script>
</body>
</html>
